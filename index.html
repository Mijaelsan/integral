 $("days").innerHTML="";for(var i=1;i<=14;i++){(function(i){var ds=dk(new Date(Date.now()-i*864e5)),r=ld(t.k+"|"+al+"|"+ds),b=document.createElement("button");b.className="day";b.innerHTML="<span>"+fmt(ds)+"</span><span>"+(r&&r.r==1?"✓":"")+"</span>";b.onclick=function(){start(t,al,ds,"archive")};$("days").appendChild(b)})(i)}

function start(t,l,date,mode){ex={t:t,l:l,date:date,mode:mode,att:0,over:false,hint:0,msg:"",bad:{},res:0};
 if(mode=="practice")R=Math.random;else seed(t.k+l+date);

 if(mode=="daily"){var s=ld(t.k+"|"+l+"|"+date);if(s){ex.att=s.a;ex.res=s.r||0;ex.over=!!s.r;if(ex.over)ex.msg=ex.res==1?"Correct — elegant!":"Out of attempts — here is the solution."}}
 $("inp").value="";document.body.style.setProperty("--ac",LV[l].c);show("ex");draw()}
function draw(){var e=ex.e,L=LV[ex.l],t=ex.t,ov=ex.over;

 var left=ex.mode=="daily"?'Resets in <b class="cd">--:--:--</b>':ex.mode=="archive"?"Archive "+fmt(ex.date):"Practice";
 $("stats").innerHTML="Streak <b>"+streak(t.k)+"</b> · Attempts <b>"+ex.att+"/5</b> · "+left;
 $("q").innerHTML=e.q+(e.type=="num"?'<div class="note">Answer with a number. Fractions like 7/3 are fine.</div>':"");

 if(e.type=="mc")e.opts.forEach(function(v){var b=document.createElement("button");b.className="opt"+(ex.bad[v]?" bad":"")+(ov&&v==e.show?" ok":"");b.textContent=v;b.onclick=function(){submit(v)};o.appendChild(b)});
 $("row").style.display=e.type=="mc"||(ov&&!(ex.res==1&&ex.typed))?"none":"flex";$("inp").readOnly=ov;
 $("kbt").style.display=e.type=="poly"&&!ov?"":"none";if(e.type!="poly"||ov)$("kb").style.display="none";
 $("fb").innerHTML=ex.msg?'<div class="box '+(ex.res==1?"ok":"bad")+'"><i></i><span>'+ex.msg+"</span></div>":"";
 var sb=$("send");sb.className=ex.mark||"";sb.textContent=ex.mark=="ok"?"✓":ex.mark=="bad"?"✕":"→";
 var u2=ex.att>=2||ov;$("h1").innerHTML='<i class="n">1</i>Hint 1';$("h2").innerHTML=u2?'<i class="n">2</i>Hint 2':'<i class="n">🔒</i>Locked';$("h2").disabled=!u2;$("h2").style.opacity=u2?1:.5;
 $("hint").innerHTML=ex.hint?e.steps[ex.hint-1]:"";
 var s=$("sol");if(ov){s.innerHTML=e.steps.map(function(x){return"<li>"+x+"</li>"}).join("")+"<li><b>Answer: "+e.show+"</b></li>";s.style.display="block";$("nx").style.display="block";$("hint").innerHTML=""}else{s.style.display="none";$("nx").style.display="none"}}
function parsePoly(s){s=s.toLowerCase().replace(/[\s*·]/g,"").replace(/[−–]/g,"-").replace(/[²³⁴⁵⁶]/g,function(c){return"^"+("²³⁴⁵⁶".indexOf(c)+2)}).replace(/d[xy]$/,"").replace(/\+c$/,"");
 var tk=s.match(/[+-]?[^+-]+/g),m={};if(!tk)return null;
 for(var i=0;i<tk.length;i++){var r=/^([+-]?)(\d*)(x?)(?:\^(\d+))?$/.exec(tk[i]);if(!r||(!r[2]&&!r[3])||(r[4]&&!r[3]))return null;
  var c=(r[2]?+r[2]:1)*(r[1]=="-"?-1:1),p=r[3]?(r[4]?+r[4]:1):0;m[p]=(m[p]||0)+c}
 for(var k in m)if(m[k]==0)delete m[k];return m}
function same(a,b){var ka=Object.keys(a),kb=Object.keys(b);return ka.length==kb.length&&ka.every(function(k){return a[k]===b[k]})}
function submit(v){if(ex.over)return;var e=ex.e,ok;
 if(e.type=="mc")ok=v===e.show;
 else if(e.type=="poly"){var m=parsePoly(v);if(!m){ex.msg="Couldn’t read that answer. Try something like 3x^2 + 5x - 1";ex.mark="bad";draw();return}ok=same(m,e.m)}
 else{var n=pnum(v);if(isNaN(n)){ex.msg="Enter a number.";ex.mark="bad";draw();return}ok=Math.abs(n-e.v)<0.011}
 ex.att++;ex.mark=ok?"ok":"bad";if(ok)ex.typed=1;
 if(ok){ex.over=true;ex.res=1;ex.msg="Correct — elegant!";if(ex.mode=="daily")streakUp(ex.t.k)}
 else if(ex.att>=5){ex.over=true;ex.res=2;ex.msg="Out of attempts — here is the solution."}
 else{ex.msg="Not quite — try again.";if(e.type=="mc")ex.bad[v]=1}
 if(ex.mode=="daily")sv(ex.t.k+"|"+ex.l+"|"+ex.date,{a:ex.att,r:ex.res});
 draw()}
